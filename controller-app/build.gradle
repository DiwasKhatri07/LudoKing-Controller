plugins {
    id 'com.android.application'
}

// Release credentials stay outside Git. Use signing.properties or LUDO_* environment variables.
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('signing.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingStoreFile = signingProperties.getProperty('storeFile') ?: System.getenv('LUDO_STORE_FILE')
def signingStorePassword = signingProperties.getProperty('storePassword') ?: System.getenv('LUDO_STORE_PASSWORD')
def signingKeyAlias = signingProperties.getProperty('keyAlias') ?: System.getenv('LUDO_KEY_ALIAS')
def signingKeyPassword = signingProperties.getProperty('keyPassword') ?: System.getenv('LUDO_KEY_PASSWORD')
def hasReleaseSigning = [signingStoreFile, signingStorePassword, signingKeyAlias, signingKeyPassword].every { it }

android {
    namespace 'app.ludo.diwas.controller'
    compileSdk 33

    defaultConfig {
        applicationId "app.ludo.diwas.controller"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.+'
}
