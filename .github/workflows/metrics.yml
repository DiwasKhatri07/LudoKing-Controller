name: Repository metrics

on:
  schedule:
    # GitHub cron cannot express a perfect rolling 40-minute interval.
    # This runs at minute 0 and 40 of every hour (*/40).
    - cron: '*/40 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out metrics file
        uses: actions/checkout@v4
      - name: Refresh GitHub metrics
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo_json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${REPOSITORY}")"
          commits_30d="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${REPOSITORY}/commits?since=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=100" | jq 'length')"
          mkdir -p .github
          cat > .github/metrics.md <<EOF
          # Repository metrics

          > Automatically refreshed by GitHub Actions. Last update: $(date -u '+%Y-%m-%d %H:%M UTC')

          | Metric | Value |
          | --- | ---: |
          | Stars | $(jq -r '.stargazers_count' <<<"${repo_json}") |
          | Forks | $(jq -r '.forks_count' <<<"${repo_json}") |
          | Open issues | $(jq -r '.open_issues_count' <<<"${repo_json}") |
          | Watchers | $(jq -r '.subscribers_count' <<<"${repo_json}") |
          | Commits in the last 30 days | ${commits_30d} |
          | Default branch | $(jq -r '.default_branch' <<<"${repo_json}") |

          [View the repository on GitHub](https://github.com/${REPOSITORY})
          EOF
      - name: Commit metrics snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/metrics.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(metrics): refresh repository snapshot [skip ci]"
          git push
